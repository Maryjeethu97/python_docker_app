apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
        - name: python-app
          image: 011379513838.dkr.ecr.us-east-1.amazonaws.com/python-docker-app:latest
          ports:
            - containerPort: 5000
